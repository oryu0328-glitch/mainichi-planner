<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>まいにち手帳</title><link rel="stylesheet" href="style.css?v=2.40"><link rel="manifest" href="manifest.webmanifest?v=2.40"><link rel="icon" type="image/png" sizes="192x192" href="icon-192.png"><link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="まいにち手帳"><meta name="theme-color" content="#e5a4b9"><style>#assetError{display:none;background:#fff1f2;color:#831843;padding:18px;border:2px solid #e879a0;border-radius:12px;margin:16px;font:16px/1.6 sans-serif}#assetError strong{display:block}</style></head><body><div id="assetError" role="alert"><strong>アプリの読み込みに失敗しました</strong>ZIPを「すべて展開」してから開くか、GitHub Pagesの公開URLで開いてください。index.html・style.css・script.jsは同じフォルダに置いてください。</div><div class="app"><aside class="sidebar"><h1>✿ まいにち手帳</h1><p class="muted">予定も、やることも、ひとつに。</p><nav id="nav"><button data-page="home" class="active">⌂ ホーム</button><button data-page="calendar">▦ カレンダー</button><button data-page="tasksNotes">☑ ToDo・メモ</button><button data-page="analysis">▥ 分析</button><button data-page="settings">⚙ 設定</button></nav></aside><main><header><div><small id="todayLabel"></small><h2 id="pageTitle">ホーム</h2></div><div class="header-shortcuts"><button type="button" data-page="globalSearch" aria-label="まとめて検索">⌕ 検索</button><button class="primary" type="button" data-page="quickAdd">＋ 追加</button></div></header><section id="content"></section></main></div><dialog id="editor"><form id="editForm"><div class="editor-heading"><h3 id="formTitle">新規登録</h3><button type="button" id="editorCloseX" class="dialog-close" aria-label="入力画面を閉じる">×</button></div><input type="hidden" name="id"><input type="hidden" name="kind"><label>タイトル<input name="title" required maxlength="120" placeholder="タイトルを入力"></label><div id="eventFields"><div class="two"><label>開始日<input name="date" type="date"></label><label>終了日<input name="endDate" type="date"></label></div><label class="check"><input name="allDay" type="checkbox"> 終日</label><div class="two" id="timeFields"><label>開始<input name="start" type="time"></label><label>終了<input name="end" type="time"></label></div><details class="editor-advanced" id="eventAdvanced"><summary>その他の設定（繰り返し・場所）</summary><label>繰り返し<select name="repeat"><option value="none">なし</option><option value="daily">毎日</option><option value="weekly">毎週</option><option value="monthly">毎月</option><option value="yearly">毎年</option><option value="weekdays">平日（月〜金）</option><option value="custom">指定曜日</option></select></label><label id="repeatDaysField" hidden>繰り返す曜日（複数選択）<span class="weekday-picks"><label><input type="checkbox" name="repeatDay" value="0">日</label><label><input type="checkbox" name="repeatDay" value="1">月</label><label><input type="checkbox" name="repeatDay" value="2">火</label><label><input type="checkbox" name="repeatDay" value="3">水</label><label><input type="checkbox" name="repeatDay" value="4">木</label><label><input type="checkbox" name="repeatDay" value="5">金</label><label><input type="checkbox" name="repeatDay" value="6">土</label></span></label><label>繰り返し終了日（任意）<input type="date" name="repeatUntil"></label><label>場所<input name="place" placeholder="任意"></label></details></div><div id="todoFields" hidden><label>期限<input name="due" type="date"></label><details class="editor-advanced" id="todoAdvanced"><summary>その他の設定（優先度・繰り返し・サブタスク）</summary><label>期限時刻（任意）<input name="dueTime" type="time"></label><label>優先度<select name="priority"><option value="medium">中</option><option value="high">高</option><option value="low">低</option></select></label><label>状態<select name="status"><option value="todo">未着手</option><option value="doing">進行中</option><option value="done">完了</option></select></label><label>関連メモ<select name="relatedNote"><option value="">なし</option></select></label><label>関連する予定<select name="related"><option value="">なし</option></select></label><label>繰り返しToDo<select name="repeatTodo"><option value="none">なし</option><option value="daily">毎日</option><option value="weekly">毎週</option><option value="monthly">毎月</option></select></label><label>サブタスク（1行に1つ）<textarea name="subtasks" rows="4" placeholder="資料収集&#10;下書き&#10;見直し"></textarea></label></details></div><div id="categoryField"><label>カテゴリー<select name="category" id="categorySelect"></select></label></div><div id="noteExtras" hidden><label>メモの日付<input name="noteDate" type="date"></label><label>保存先フォルダ<select name="folder" id="noteFolderSelect"><option value="">📄 フォルダなし</option></select></label><div class="folder-create-inline"><label>新しいフォルダを作成<input id="newNoteFolder" maxlength="40" placeholder="例：仕事、勉強、日記"></label><button type="button" id="createNoteFolder" class="primary">＋ 作成して選択</button></div><label>タグ（カンマ区切り）<input name="tags" maxlength="160" placeholder="例：旅行,重要"></label><label class="check"><input type="checkbox" name="pinned"> 📌 上部にピン留め</label></div><div id="noteLinkField" hidden><label>関連予定<select name="noteEvent"><option value="">なし</option></select></label><label>関連ToDo<select name="noteTodo"><option value="">なし</option></select></label></div><label>メモ<textarea name="memo" rows="3"></textarea></label><div id="eventExtras" hidden><input type="hidden" name="notifyMode" value="inherit"><input type="hidden" name="reminder" value="none"></div><div class="actions"><button type="button" id="deleteButton" class="danger" hidden>削除</button><button type="button" id="templateSaveButton" hidden>テンプレ保存</button><button type="button" id="duplicateButton" hidden>コピー</button><button type="button" id="moveButton" hidden>移動</button><button type="button" id="cancelButton">キャンセル</button><button class="primary" type="submit">保存する</button></div></form></dialog><dialog id="dayActionDialog" class="choice-dialog"><div class="editor-heading"><h3 id="dayActionDate"></h3><button type="button" id="dayActionCloseX" class="dialog-close" aria-label="選択画面を閉じる">×</button></div><p class="muted">新規追加または編集する予定を選んでください。</p><div id="dayActionList" class="choice-list"></div><div class="actions"><button id="dayActionClose" type="button">閉じる</button><button id="dayActionNew" class="primary" type="button">＋ 予定を追加</button></div></dialog><dialog id="deleteChoiceDialog" class="choice-dialog" aria-labelledby="deleteChoiceTitle"><div class="editor-heading"><h3 id="deleteChoiceTitle">繰り返し予定の削除</h3></div><p>どの範囲を削除しますか？</p><div class="choice-list"><button type="button" id="deleteChoiceOne">この日だけ削除</button><button type="button" id="deleteChoiceAll" class="danger">すべての繰り返し予定を削除</button><button type="button" id="deleteChoiceCancel">キャンセル（削除しない）</button></div></dialog><dialog id="colorPaletteDialog" class="palette-dialog" aria-labelledby="paletteTitle"><div class="editor-heading"><h3 id="paletteTitle">カテゴリーの色を選ぶ</h3><button type="button" id="paletteCloseX" class="dialog-close" aria-label="色選択を閉じる">×</button></div><p class="muted small"><span id="paletteCategoryName"></span>の色を選択してください（30色）</p><div id="paletteOptions" class="palette-grid" role="radiogroup" aria-label="色の選択"></div><div class="actions"><button type="button" id="paletteCancel">キャンセル</button><button type="button" id="paletteApply" class="primary">この色にする</button></div></dialog><dialog id="categoryActionsDialog" class="category-actions-dialog choice-dialog" aria-labelledby="categoryActionsTitle"><div class="editor-heading"><h3 id="categoryActionsTitle">カテゴリーを編集</h3><button type="button" id="categoryActionsCloseX" class="dialog-close" aria-label="閉じる">×</button></div><p id="categoryActionsName" class="muted small"></p><div class="choice-list"><button type="button" id="categoryActionRename">✎ 名前を変更</button><button type="button" id="categoryActionColor">◉ 色を変更</button><button type="button" id="categoryActionDelete" class="danger">削除</button></div><button type="button" id="categoryActionsClose">キャンセル</button></dialog><div id="toast" role="status" aria-live="polite"></div><button id="undoButton" hidden>↶ 元に戻す</button><script src="script.js?v=2.40"></script><script>window.addEventListener('load',function(){var css=!!(document.styleSheets.length>1),js=!!document.querySelector('.panel');if(!css||!js){document.getElementById('assetError').style.display='block';}});</script></body></html>
